<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" />

  <!-- Math symbols in background -->
  <text x="70" y="140" font-family="system-ui, sans-serif" font-weight="900" font-size="76" fill="#ffffff" fill-opacity="0.25">+</text>
  <text x="390" y="150" font-family="system-ui, sans-serif" font-weight="900" font-size="90" fill="#ffffff" fill-opacity="0.25">−</text>
  <text x="65" y="420" font-family="system-ui, sans-serif" font-weight="900" font-size="76" fill="#ffffff" fill-opacity="0.25">×</text>
  <text x="380" y="420" font-family="system-ui, sans-serif" font-weight="900" font-size="80" fill="#ffffff" fill-opacity="0.25">÷</text>

  <!-- Central Star badge -->
  <g filter="url(#shadow)">
    <!-- Shield / Badge back -->
    <circle cx="256" cy="245" r="140" fill="#ffffff" />
    <!-- Character Face (Friendly Owl / Mascot) -->
    <circle cx="256" cy="245" r="126" fill="#FBBF24" />
    <!-- Cheeks -->
    <ellipse cx="195" cy="275" rx="16" ry="10" fill="#F87171" opacity="0.8" />
    <ellipse cx="317" cy="275" rx="16" ry="10" fill="#F87171" opacity="0.8" />
    <!-- Big cute eyes -->
    <ellipse cx="205" cy="230" rx="26" ry="32" fill="#ffffff" />
    <ellipse cx="307" cy="230" rx="26" ry="32" fill="#ffffff" />
    <circle cx="212" cy="232" r="16" fill="#1E1B4B" />
    <circle cx="314" cy="232" r="16" fill="#1E1B4B" />
    <circle cx="218" cy="225" r="6" fill="#ffffff" />
    <circle cx="320" cy="225" r="6" fill="#ffffff" />
    <!-- Smile -->
    <path d="M 226 270 Q 256 305 286 270" stroke="#1E1B4B" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Explorer Hat -->
    <path d="M 180 185 Q 256 120 332 185 Z" fill="#10B981" />
    <ellipse cx="256" cy="185" rx="90" ry="16" fill="#059669" />
    <polygon points="256,120 264,136 282,137 268,148 273,165 256,154 239,165 244,148 230,137 248,136" fill="url(#starGrad)" />
  </g>

  <!-- Floating Star -->
  <polygon points="120,200 126,215 142,216 130,227 134,242 120,233 106,242 110,227 98,216 114,215" fill="url(#starGrad)" filter="url(#shadow)" />
  <polygon points="380,210 385,223 399,224 388,233 392,246 380,238 368,246 372,233 361,224 375,223" fill="url(#starGrad)" filter="url(#shadow)" />

  <!-- App Title Banner -->
  <g filter="url(#shadow)">
    <rect x="76" y="390" width="360" height="72" rx="36" fill="#F43F5E" />
    <text x="256" y="440" font-family="'Fredoka', 'Nunito', system-ui, sans-serif" font-weight="900" font-size="36" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">MATHS HERO</text>
  </g>
</svg>
